name: Gource visualization

on:
  push:
    branches: [main, master, v1.5-dev]
  workflow_dispatch:

jobs:
  gource:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gource Action
        uses: uses: nbprojekt/gource-action@57256d303c5a9a5e72ed92ba13e3e83c5ec8b257
        with:
          gource_resolution: 1080p
          gource_fps: 60
          gource_filename_time: 3
          gource_hide_items: 'mouse,date,filenames'
          gource_title: DM Assist

      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Re-encode to 720p
        run: |
          ffmpeg -y -i ./gource/gource.mp4 \
            -c:v libx264 -crf 22 -preset medium \
            -vf "scale=-1:720" -sws_flags lanczos \
            -c:a aac -b:a 128k \
            ./gource-720p.mp4

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-gource-720p
          path: ./gource-720p.mp4

      - name: Commit video
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gource-720p.mp4 || true
          git diff --staged --quiet || git commit -m "ci: update gource visualization (automated)"
          git push
