name: Gource visualization

on:
  push:
    branches: [main, master, v1.5-dev]
  workflow_dispatch:

concurrency:
  group: gource-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gource:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Gource Action
        uses: nbprojekt/gource-action@57256d303c5a9a5e72ed92ba13e3e83c5ec8b257 # v1.3.0
        with:
          gource_resolution: 1080p
          gource_fps: 60
          gource_filename_time: 3
          gource_hide_items: "mouse,date,filenames"
          gource_title: "DM Assist development timeline"
          gource_max_files: 1500
          gource_highlight_users: true
          gource_output_framerate: 30
          gource_stop_at_end: true
          gource_auto_skip_seconds: 0.5
          gource_multi_sampling: true
          gource_seconds_per_day: 0.5

      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Re-encode to 720p
        run: |
          ffmpeg -y -i ./gource/gource.mp4 \
            -c:v libx264 -crf 18 -preset medium -tune film \
            -vf "scale=-1:720" -sws_flags lanczos \
            -c:a aac -b:a 128k \
            ./gource-720p.mp4

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dm-assist-gource-720p
          path: ./gource-720p.mp4
          retention-days: 30

      - name: Commit video
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gource-720p.mp4 || true
          git diff --staged --quiet || git commit -m "ci: update gource visualization (automated)"
          git push
